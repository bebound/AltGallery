name: Update apps.json and all-apps.json

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skip_failures:
        description: 'Skip apps whose repo fails (404/renamed) instead of failing the whole run'
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # update.sh uses `uvx altgen`
      - uses: astral-sh/setup-uv@v7

      - name: Run update.sh
        run: ./update.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Only set (to "1") when a manual run ticked the box; empty otherwise,
          # so scheduled/push runs still fail on a broken repo.
          SKIP_FAILURES: ${{ inputs.skip_failures && '1' || '' }}

      # Generate a proxy mirror beside each app source, using the same URL
      # rewriting rules as the combined all-apps source below.
      - name: Generate per-app proxy sources
        run: |
          set -euo pipefail
          shopt -s nullglob
          for source in apps/*/apps.json; do
            python3 tools/make_proxy.py "$source" "${source%/apps.json}/apps-proxy.json"
          done

      # Mirror of all-apps.json for users who cannot reach GitHub: the raw
      # files it references (icons, screenshots, news images) and the release
      # ipa downloads go through gh-proxy.com. Release pages, news links and
      # the website stay plain GitHub URLs. Regenerated from scratch on every
      # run, so it always matches the source generated above.
      - name: Generate all-apps-proxy.json
        run: python3 tools/make_proxy.py all-apps.json all-apps-proxy.json

      # Generated app sources and proxy mirrors are gitignored, so
      # `git add -A` won't pick them up. Stage them explicitly (force) so the
      # regenerated sources can be committed here — contributors never commit
      # them.
      - name: Stage generated sources
        run: git add -f all-apps.json all-apps-proxy.json apps/*/apps.json apps/*/apps-proxy.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update app sources and proxy mirrors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
