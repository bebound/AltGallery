name: Build and deploy GitHub Pages

# The page is a static build of all-apps.json (see tools/build_site.py); the
# images it displays are copied beside it into _site/media/.
# It deploys only after the update workflow finishes, so a push to master
# produces one Pages deployment record instead of two: the push triggers the
# update workflow, and its completion triggers this one. Pushes made by the
# update workflow itself use GITHUB_TOKEN and never trigger `push` workflows,
# which is why the trigger has to go through `workflow_run` rather than `push`.
on:
  workflow_run:
    workflows: ["Update apps.json and all-apps.json"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # build_site.py re-encodes every displayed image (Pillow); the runner's
      # system python does not ship it.
      - name: Install image dependencies
        run: pip install --disable-pip-version-check pillow

      - name: Build the page
        run: |
          python3 tools/build_site.py
          rm -f _site/preview.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
