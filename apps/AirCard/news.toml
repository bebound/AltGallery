# render_news.py config: python3 templates/render_news.py --out apps/AirCard
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "AirCard-iOS"
tagline = "Wallet card skins & passcode themes"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#5020E0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#5020E0"      # bottom-right glow (default: [source] tint_color)
# background = "#DBD6EB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#EAE7F3"        # gradient mid stop (derived from background)
# bg_dark = "#C3BBDE"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#6B51BD" # tagline text (derived from background)
