# altgen config for the Iridium AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "intraducine/iridium"

[source]
name = "Iridium"
subtitle = "Iridium AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Iridium"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Iridium/icon.png"
website = "https://github.com/intraducine/iridium"
tint_color = "#1C1C1E"

[app]
name = "Iridium"
bundle_identifier = "software.iridium"
developer_name = "intraducine"
subtitle = "Experimental Windows-game runtime for iPhone and iPad"
description = "An experimental iPhone and iPad Windows-game runtime, with a native game library and touch, keyboard, mouse, and controller integration. Requires iOS 18+, JIT, and your own game files; compatibility varies by game and device."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Iridium/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Iridium/images/all-games.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Iridium/images/settings.png",
]
tint_color = "#1C1C1E"
min_os_version = "18.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# The repo also tags build dependencies (e.g. deps-metal-shader-converter-…),
# which never start with a digit, so the anchored pattern skips them.
version_pattern = "^(\\d+\\.\\d+\\.\\d+)"
# asset_pattern is a regex (not glob); the release ships Iridium-unsigned.ipa
asset_pattern = "Iridium-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Iridium/images/news.png"

[output]
path = "apps.json"
