# render_news.py config: python3 tools/render_news.py --out apps/iTorrent
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "iTorrent"
tagline = "Torrent client for iOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#F19E69"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#F19E69"      # bottom-right glow (default: [source] tint_color)
# background = "#EBDDD6"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#F3EBE7"        # gradient mid stop (derived from background)
# bg_dark = "#DEC6BB"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#BD7551" # tagline text (derived from background)
