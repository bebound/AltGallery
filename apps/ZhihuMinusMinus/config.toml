# altgen config for the ZhihuMinusMinus AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "huamurui/zhihu-minus-minus"

[source]
name = "ZhihuMinusMinus"
subtitle = "ZhihuMinusMinus AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for ZhihuMinusMinus"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ZhihuMinusMinus/icon.png"
website = "https://github.com/huamurui/zhihu-minus-minus"
tint_color = "#0084ff"

[app]
name = "ZhihuMinusMinus"
bundle_identifier = "com.huamu013.ZhihuMinusMinus"
developer_name = "huamurui"
subtitle = "轻量、纯净的第三方知乎客户端"
description = "基于 React Native (Expo) 构建的轻量级第三方知乎客户端，无广告，支持多账号切换、游客模式、全局主题色自定义与深色模式，可查看热榜、推荐、回答、文章、想法与评论区，并支持从 GitHub Releases 自动更新。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ZhihuMinusMinus/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ZhihuMinusMinus/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ZhihuMinusMinus/images/detail.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ZhihuMinusMinus/images/hot.png",
]
tint_color = "#0084ff"
min_os_version = "15.1"

[versions]
strip_v_prefix = true
include_prereleases = false
version_pattern = "^(\\d+\\.\\d+\\.\\d+)"
# asset_pattern is a regex (not glob): each release ships one unsigned ipa
# named zhihu-minus-minus-v<version>-unsigned.ipa
asset_pattern = "zhihu-minus-minus-.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by templates/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ZhihuMinusMinus/images/news.png"

[output]
path = "apps.json"
