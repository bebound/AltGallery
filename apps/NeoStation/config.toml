# altgen config for the NeoStation iOS AltStore source.
# Run: uvx altgen -c config.toml
# The project ships no AltStore source of its own, so the fields below come
# from the README plus the shipped IPA's Info.plist
# (CFBundleIdentifier com.neogamelab.neostation).

[github]
repo = "TarbleFR/neostation-ios"

[source]
name = "NeoStation iOS"
subtitle = "NeoStation iOS AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for NeoStation iOS"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/NeoStation/icon.png"
website = "https://github.com/TarbleFR/neostation-ios"
tint_color = "#01E989"

[app]
name = "NeoStation iOS"
bundle_identifier = "com.neogamelab.neostation"
developer_name = "TarbleFR"
subtitle = "Emulation frontend for iPhone and iPad"
description = "An independently maintained iOS/iPadOS fork of NeoStation, with embedded Dolphin, ARMSX2, RPCS3, Dusklight and KartPad runtimes alongside RetroArch and MeloNX integration, JIT workflows and mobile-friendly game and session management."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/NeoStation/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/NeoStation/images/intro.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/NeoStation/images/library.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/NeoStation/images/settings.png",
]
tint_color = "#01E989"
# README documents "iOS 18 or newer" as the run requirement. Note the IPA's
# Info.plist declares MinimumOSVersion 17.4; the documented requirement wins
# here so users on 17.x are not offered an install the project does not support.
min_os_version = "18.0"

[versions]
strip_v_prefix = true
include_prereleases = false
version_pattern = "^(\\d+\\.\\d+\\.\\d+)"
# asset_pattern is a regex (not glob). Every release so far ships exactly one
# ipa, always named NeoStation.ipa alongside .zip/.tar.gz source assets, so
# ".*\.ipa$" selects it and survives a future rename or version suffix.
asset_pattern = ".*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/NeoStation/images/news.png"

[output]
path = "apps.json"
