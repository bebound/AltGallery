# render_news.py config: python3 tools/render_news.py --out apps/NeoStation
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "NeoStation iOS"
tagline = "Emulation frontend for iPhone and iPad"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#01E989"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#01E989"      # bottom-right glow (default: [source] tint_color)
# Pinned: the icon's dominant sample is the near-white "N" glyph (#E0E0F0), so
# the auto background came out a washed lavender unrelated to the neon green
# brand color. A light shade of that green reads as one identity.
background = "#D9F7EC"      # gradient base
# bg_mid = "#EEFBF7"        # gradient mid stop (derived from background)
# bg_dark = "#B7F0DB"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#5CC19C" # tagline text (derived from background)
