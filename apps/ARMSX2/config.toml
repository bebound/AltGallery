# altgen config for the ARMSX2 AltStore source.
# Run: uvx altgen -c config.toml
# ARMSX2 ships iOS IPAs only in its nightly GitHub releases (mainline 2.6.x
# releases are Android-only), so include_prereleases must stay enabled.

[github]
repo = "ARMSX2/ARMSX2"

[source]
name = "ARMSX2"
subtitle = "ARMSX2 AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for ARMSX2"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ARMSX2/icon.png"
website = "https://github.com/ARMSX2/ARMSX2"
tint_color = "#3CAEFF"

[app]
name = "ARMSX2"
bundle_identifier = "com.armsx2.ios"
developer_name = "ARMSX2"
subtitle = "PlayStation 2 emulator for ARM64"
description = "A free and open-source PlayStation 2 (PS2) emulator based on PCSX2, with native ARM64 JIT recompilers. Play PS2 games on your phone, PC, or gaming handheld."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ARMSX2/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ARMSX2/images/game.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ARMSX2/images/list.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ARMSX2/images/settings.png",
]
tint_color = "#3CAEFF"
min_os_version = "17.0"

[versions]
# No ipa in normal release
include_prereleases = true
# asset_pattern is a regex (not glob): matches any ipa asset. Nightlies ship
# *-iOS-arm64.ipa; older iOSv* releases ship ARMSX2-iOS-*.ipa.
asset_pattern = ".*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/ARMSX2/images/news.png"

[output]
path = "apps.json"
