# altgen config for the Kazumi-Swift AltStore source.
# Run: uvx altgen -c config.toml
# Kazumi-Swift: native SwiftUI rewrite of Kazumi with danmaku support

[github]
repo = "LinkPass888/Kazumi-Swift"

[source]
name = "Kazumi-Swift"
subtitle = "Kazumi-Swift AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Kazumi-Swift"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Kazumi-Swift/icon.png"
website = "https://github.com/LinkPass888/Kazumi-Swift"
tint_color = "#45A992"

[app]
name = "Kazumi-Swift"
bundle_identifier = "com.linkpass.kazumi"
developer_name = "LinkPass888"
subtitle = "基于自定义规则的番剧采集APP，支持流媒体在线观看、弹幕与实时超分辨率，使用 SwiftUI 实现。"
description = "基于自定义规则的番剧采集与在线观看客户端，带弹幕。原生 SwiftUI 实现，界面使用 iOS 26 的液态玻璃材质，随系统外观与辅助功能设置变化。\n\n内置 mpv 播放内核与 Anime4K 实时超分辨率，支持弹弹play 弹幕、Bangumi 追番绑定、时间表、下载与 WebDAV 备份。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Kazumi-Swift/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Kazumi-Swift/images/01-recommend.jpeg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Kazumi-Swift/images/02-detail.jpeg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Kazumi-Swift/images/03-player.jpeg",
]
tint_color = "#45A992"
min_os_version = "26.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Each release contains a single iOS ipa: Kazumi_ios_<version>_no_sign.ipa
asset_pattern = "Kazumi_ios_.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Kazumi-Swift/images/news.png"

[output]
path = "apps.json"
