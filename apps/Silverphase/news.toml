# render_news.py config: python3 tools/render_news.py --out apps/Silverphase
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Silverphase"
tagline = "Film & print simulator"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived.
[colors]
# tint = "#FF9F0A"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#FF9F0A"      # bottom-right glow (default: [source] tint_color)
# background = "#F6F0E6"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#FAF6EE"        # gradient mid stop (derived from background)
# bg_dark = "#EFE4D2"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#B26A00" # tagline text (derived from background)
