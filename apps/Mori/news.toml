# render_news.py config: uv run tools/render_news.py --out apps/Mori
# Colors are pinned explicitly: Mori's icon is a black mark on white, so the
# auto-derived tagline picked up a grey cast from the icon's white ground. A
# neutral grey scale matches the monochrome mark instead.

name = "Mori"
tagline = "Media downloader\nfor 16 platforms"

# Color notes — each key below controls one element of the image.
[colors]
tint = "#27282A"          # NEW UPDATE badge + top-left glow
tint_alt = "#27282A"      # bottom-right glow
background = "#EDEEF0"    # gradient base
bg_mid = "#F7F8F9"        # gradient mid stop
bg_dark = "#DCDEE1"       # gradient end stop
text_color = "#111111"    # app name
tagline_color = "#565A61" # tagline text
