# altgen config for the VRCM AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "vrcm-team/VRCM"

[source]
name = "VRCM"
subtitle = "VRCM AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for VRCM"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/VRCM/icon.png"
website = "https://github.com/vrcm-team/VRCM"
tint_color = "#6451f1"

[app]
name = "VRCM"
bundle_identifier = "io.github.vrcmteam.vrcm"
developer_name = "vrcm-team"
subtitle = "Bring your VRChat social life to your phone"
description = "VRCM is a cross-platform VRChat companion focused on social connection and convenience. Explore your social circles, remember time spent together, and move smoothly from shared links to worlds, interactions, and real-world meetups."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/VRCM/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/VRCM/images/Feature-Friend-Network.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/VRCM/images/Feature-Gallery-Mobile.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/VRCM/images/Feature-Meetup-Card.png",
]
tint_color = "#6451f1"
min_os_version = "15.3"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): .*\.ipa$ matches all ipa assets
asset_pattern = "VRCM-.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/VRCM/images/news.png"

[output]
path = "apps.json"
