# altgen config for the AniBaka AltStore source.
# Run: uvx altgen -c config.toml
# AniBaka: cross-platform anime aggregation & danmaku client (Flutter)

[github]
repo = "AniBakaBaka/AniBaka"

[source]
name = "AniBaka"
subtitle = "AniBaka AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for AniBaka"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniBaka/icon.png"
website = "https://github.com/AniBakaBaka/AniBaka"
tint_color = "#0077B6"

[app]
name = "AniBaka"
bundle_identifier = "ani.baka"
developer_name = "AniBakaBaka"
subtitle = "跨平台番剧聚合、媒体播放与弹幕客户端"
description = "AniBaka 是一个基于 Flutter 的跨平台番剧聚合与媒体播放客户端，支持多番剧源、弹幕、字幕、离线缓存与本地媒体库，并提供动漫实时超分辨率画质增强。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniBaka/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniBaka/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniBaka/images/detail.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniBaka/images/player.png",
]
tint_color = "#0077B6"
min_os_version = "13.0"

[versions]
include_prereleases = false
# Each release ships a single iOS ipa (e.g. baka-5.0.7+0811-ios-unsigned.ipa)
asset_pattern = ".*\\.ipa$"
# Tags are like 5.0.7+0811; extract the clean semver from the release name (5.0.7)
version_source = "release"
version_pattern = "^(\\d+\\.\\d+\\.\\d+)"
build_version_pattern = "\\+(\\d+).*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniBaka/images/news.png"

[output]
path = "apps.json"
