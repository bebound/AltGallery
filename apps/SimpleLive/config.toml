# altgen config for the Simple Live AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "June6699/dart_simple_live"

[source]
name = "Simple Live"
subtitle = "Simple Live AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Simple Live"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SimpleLive/icon.png"
website = "https://github.com/June6699/dart_simple_live"
tint_color = "#24A7EB"

[app]
name = "Simple Live"
bundle_identifier = "com.xycz.simple-live"
developer_name = "June6699"
subtitle = "支持弹幕与 IPTV 的开源多平台直播聚合播放器"
description = "简简单单的看直播（Simple Live）是一款使用 Flutter 开发的开源多平台直播聚合播放器，支持虎牙、斗鱼、哔哩哔哩、抖音、快手等平台的直播与弹幕，并内置公开的 IPTV 直播源。支持关注、标签、历史与弹幕屏蔽词，配置可导入导出，并可通过房间服务、局域网或 WebDAV 同步。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SimpleLive/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SimpleLive/images/home.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SimpleLive/images/category.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SimpleLive/images/settings.webp",
]
tint_color = "#24A7EB"
min_os_version = "13.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each app release ships exactly one iOS
# build, named ios_no_sign.ipa. The TV releases carry no ipa at all, so they
# are skipped for lack of a matching asset.
asset_pattern = "ios_no_sign\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SimpleLive/images/news.webp"

[output]
path = "apps.json"
