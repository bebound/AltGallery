# render_news.py config: uv run tools/render_news.py --out apps/TDrive
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "TDrive"
tagline = "Telegram cloud drive"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#20A0E0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#20A0E0"      # bottom-right glow (default: [source] tint_color)
# background = "#D9EFFA"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#EAF7FD"        # gradient mid stop (derived from background)
# bg_dark = "#BEE3F6"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#2A9FD8" # tagline text (derived from background)
