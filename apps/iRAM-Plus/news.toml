# render_news.py config: uv run tools/render_news.py --out apps/iRAM-Plus
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "iRAM+"
tagline = "More memory for sideloaded apps"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#64BE7E"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#64BE7E"      # bottom-right glow (default: [source] tint_color)
# background = "#D9F0DF"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E9F7EC"        # gradient mid stop (derived from background)
# bg_dark = "#C2E5CB"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#3F9E5E" # tagline text (derived from background)
