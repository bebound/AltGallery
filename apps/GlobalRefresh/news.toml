# render_news.py config: uv run tools/render_news.py --out apps/GlobalRefresh
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "GlobalRefresh"
tagline = "画中画悬浮窗\n解锁 ProMotion 120Hz"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#177FFD"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#177FFD"      # bottom-right glow (default: [source] tint_color)
# background = "#D6E6FA"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E7F0FC"        # gradient mid stop (derived from background)
# bg_dark = "#BBD4F3"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#2F7FD8" # tagline text (derived from background)
