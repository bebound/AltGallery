# altgen config for the Applesauce AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "0xjohnnydev/Applesauce"

[source]
name = "Applesauce"
subtitle = "Applesauce AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Applesauce"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Applesauce/icon.webp"
website = "https://github.com/0xjohnnydev/Applesauce"
tint_color = "#F01F14"

[app]
name = "Applesauce"
bundle_identifier = "io.github.johnny901901901.applesauce"
developer_name = "Unofficial iOS port contributors"
subtitle = "A playful emulator for iOS"
description = "Plays supported 32-bit iPhone games on modern devices, carrying both the HyperHLE v1.0.6 and touchHLE 0.2.3 emulator cores so you can pick which one runs each game. An unaffiliated fork, endorsed by neither project. JIT must be enabled for each new app process. No games are included."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Applesauce/icon.webp"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Applesauce/images/library-games.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Applesauce/images/settings.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Applesauce/images/about.webp",
]
tint_color = "#F01F14"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Tags are ios-v0.4.2, which strip_v_prefix leaves alone, so the version is
# read from the release name ("Applesauce 0.4.2") instead.
version_source = "release"
version_pattern = "(\\d+\\.\\d+\\.\\d+)"
# asset_pattern is a regex (not glob): every release ships the unsigned ipa
# named Applesauce-iOS-unsigned.ipa, plus TrollStore variants.
asset_pattern = "Applesauce-iOS-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Applesauce/images/news.webp"

[output]
path = "apps.json"
