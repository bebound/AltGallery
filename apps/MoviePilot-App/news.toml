# render_news.py config: python3 tools/render_news.py --out apps/MoviePilot-App
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "MoviePilot"
tagline = "MoviePilot iOS 客户端"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#8844F6"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#8844F6"      # bottom-right glow (default: [source] tint_color)
# background = "#D6D6EB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E7E7F3"        # gradient mid stop (derived from background)
# bg_dark = "#BBBBDE"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#5151BD" # tagline text (derived from background)
