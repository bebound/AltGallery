# altgen config for the MoviePilot-App AltStore source.
# Run: uvx altgen -c config.toml
# Fields derived from the jxxghp/MoviePilot-App README and release ipa
# (no AltStore source in the repo).

[github]
repo = "jxxghp/MoviePilot-App"

[source]
name = "MoviePilot"
subtitle = "MoviePilot AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for MoviePilot"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilot-App/icon.png"
website = "https://github.com/jxxghp/MoviePilot-App"
tint_color = "#8844F6"

[app]
name = "MoviePilot"
bundle_identifier = "org.moviepilot.app"
developer_name = "jxxghp"
subtitle = "MoviePilot 的 iOS 原生客户端"
description = "MoviePilot 的 iOS 客户端，使用系统原生导航、搜索与快捷面板，业务页面、弹窗和插件界面复用 MoviePilot-Frontend，支持 iOS 26+ 的 Liquid Glass、侧滑返回、卡片长按菜单与前后台恢复。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilot-App/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilot-App/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilot-App/images/recommend.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilot-App/images/downloads.png",
]
tint_color = "#8844F6"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Every release ships exactly one ipa: MoviePilot-<version>-unsigned.ipa
asset_pattern = "MoviePilot-.*unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilot-App/images/news.png"

[output]
path = "apps.json"
