# render_news.py config: python3 tools/render_news.py --out apps/Aidoku
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Aidoku"
tagline = "Free and open source manga reader for iOS and iPadOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#FF375F"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#FF375F"      # bottom-right glow (default: [source] tint_color)
# background = "#EBD6DB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#F3E7EA"        # gradient mid stop (derived from background)
# bg_dark = "#DEBBC3"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#BD516B" # tagline text (derived from background)
