# render_news.py config: .venv/bin/python tools/render_news.py --out apps/PureLive
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "PureLive"
tagline = "开源多平台直播聚合播放器"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#50B0F0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#50B0F0"      # bottom-right glow (default: [source] tint_color)
# background = "#D7E9F6"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E5F0F9"        # gradient mid stop (derived from background)
# bg_dark = "#C0D8EA"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#3B7EA6" # tagline text (derived from background)
