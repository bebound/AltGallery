# altgen config for the UTM AltStore source.
# Run: uvx altgen -c config.toml
# UTM: Virtual machines for iOS (with JIT support)

[github]
repo = "utmapp/UTM"

[source]
name = "UTM"
subtitle = "UTM AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for UTM"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/UTM/icon.png"
website = "https://github.com/utmapp/UTM"
tint_color = "#1a2cc2"

[app]
name = "UTM"
bundle_identifier = "com.utmapp.UTM"
developer_name = "osy"
subtitle = "Virtual machines for iOS"
description = "UTM is a full featured virtual machine host for iOS. In short, it allows you to run Windows, Android, and more on your iPhone and iPad.\n\nThis version requires using AltJIT. Install UTM SE for slower emulation without JIT.\n\nMore information at https://getutm.app/\n\nFeatures:\n\n• Emulate any Processor\n30+ processors supported by qemu including x86_64, ARM64, and RISC-V\n• Run any Operating System\nWindows, Linux, and more natively and securely on iOS within an App\n• Fast Emulation\nPara-virtualization with SPICE and JIT compilation with TCG\n• High Compatibility\niOS 14+ supported. Works on iPhone and iPad. No jailbreak needed\n• Free and Open Source\nUTM and its dependencies are all free and open source\n• Easy to Use\nConfigure and customize your VM in a native UI"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/UTM/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/UTM/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/UTM/images/settings.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/UTM/images/display.png",
]
tint_color = "#1a2cc2"
min_os_version = "14.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Each release contains a single ipa: UTM.ipa
asset_pattern = "UTM\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/UTM/images/news.png"

[output]
path = "apps.json"
