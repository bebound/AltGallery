# render_news.py config: python3 tools/render_news.py --out apps/UTM
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "UTM"
tagline = "Virtual machines for iOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#1A2CC2"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#1A2CC2"      # bottom-right glow (default: [source] tint_color)
# background = "#D6DDEB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E7EBF3"        # gradient mid stop (derived from background)
# bg_dark = "#BBC6DE"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#5175BD" # tagline text (derived from background)
