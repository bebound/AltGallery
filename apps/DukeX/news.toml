# render_news.py config: ./.venv/bin/python tools/render_news.py --out apps/DukeX
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "DukeX"
tagline = "Xbox emulation on iOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#8FCA39"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#8FCA39"      # bottom-right glow (default: [source] tint_color)
# background = "#E6EBD6"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#F0F3E7"        # gradient mid stop (derived from background)
# bg_dark = "#D5DEBB"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#A3BD51" # tagline text (derived from background)
