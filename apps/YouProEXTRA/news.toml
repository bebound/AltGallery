# render_news.py config: ./.venv/bin/python tools/render_news.py --out apps/YouProEXTRA
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "YouProEXTRA"
tagline = "YouTube mod with customizable tweaks"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
tint = "#FF0000"            # NEW UPDATE badge + top-left glow (default: [app] tint_color)
tint_alt = "#FF0000"        # bottom-right glow (default: [source] tint_color)
# background = "#F3D6D6"    # gradient base (derived from the icon's dominant color)
