# altgen config for the YouProEXTRA AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "mrdrvt99/YouProEXTRA"

[source]
name = "YouProEXTRA"
subtitle = "YouProEXTRA AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for YouProEXTRA"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouProEXTRA/icon.png"
website = "https://github.com/mrdrvt99/YouProEXTRA"
tint_color = "#FF0000"

[app]
name = "YouProEXTRA"
bundle_identifier = "com.google.ios.youtube"
developer_name = "alibusut"
subtitle = "YouTube mod with customizable tweaks"
description = "YouPro mod of YouTube for iOS. Includes no ads, background playback, downloads, iSponsorBlock, PiP, and a host of customizable tweaks."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouProEXTRA/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouProEXTRA/images/list.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouProEXTRA/images/play.jpg",
]
tint_color = "#FF0000"
min_os_version = "16.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): only match the flagship YouProExtra IPA,
# excluding other builds like YTLite/YTKillerPlus/YTKACE/YouMod/DLTube.
asset_pattern = "youproextra_.*\\.ipa$"
# Extract the base YouTube version from the filename YouProExtra_<YouTube version>_<tweak version>.ipa
build_version_pattern = "_([0-9]+\\.[0-9]+\\.[0-9]+)_"
version_pattern = "^YouProExtra_(.+)_.+\\.ipa$"  # e.g. YouProExtra_21.24.3_1.3.1.ipa -> 21.24.3
version_source = "filename"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouProEXTRA/images/news.png"

[output]
path = "apps.json"
