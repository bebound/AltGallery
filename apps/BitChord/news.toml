# render_news.py config: uv run tools/render_news.py --out apps/BitChord
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "BitChord"
tagline = "YouTube Music client\nfor iPhone & iPad"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#FC546C"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#FC546C"      # bottom-right glow (default: [source] tint_color)
# background = "#FBD9DE"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#FDEBED"        # gradient mid stop (derived from background)
# bg_dark = "#F7C2CB"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#C04A60" # tagline text (derived from background)
