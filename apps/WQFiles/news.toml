# render_news.py config: python3 tools/render_news.py --out apps/WQFiles
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "WQ Files"
tagline = "Every app's files, no jailbreak"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#1E8FC7"            # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#1E8FC7"        # bottom-right glow (default: [source] tint_color)
# background = "#D8E7F3"      # gradient base (derived from the icon's dominant color)
# bg_mid = "#E7F0F8"          # gradient mid stop (derived from background)
# bg_dark = "#C0D8EC"         # gradient end stop (derived from background)
# text_color = "#111111"      # app name (auto white/black)
# tagline_color = "#3A7FB0"   # tagline text (derived from background)
