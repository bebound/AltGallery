# render_news.py config: python3 tools/render_news.py --out apps/DolphiniOS
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "DolphiniOS"
tagline = "GameCube and Wii emulator for iOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#E0B030"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#E0B030"      # bottom-right glow (default: [source] tint_color)
# background = "#EBE3D6"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#F3EFE7"        # gradient mid stop (derived from background)
# bg_dark = "#DED0BB"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#BD9451" # tagline text (derived from background)
