# altgen config for the VeneraNext AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "CyrilPeng/Venera-Next"

[source]
name = "VeneraNext"
subtitle = "VeneraNext AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for VeneraNext"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Venera-Next/icon.png"
website = "https://github.com/CyrilPeng/Venera-Next"
tint_color = "#2090E0"

[app]
name = "VeneraNext"
bundle_identifier = "com.github.cyrilpeng.veneranext"
developer_name = "CyrilPeng"
subtitle = "跨平台漫画阅读器"
description = "基于 Flutter 的跨平台漫画阅读器，支持本地漫画、WebDAV 漫画源与第三方网络漫画源，支持 Android、iOS、Windows、Linux、macOS 平台。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Venera-Next/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Venera-Next/images/home.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Venera-Next/images/explorer.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Venera-Next/images/search.jpg",
]
tint_color = "#2090E0"
min_os_version = "14.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each release publishes a single ipa, named VeneraNext-ios-*.ipa
asset_pattern = "VeneraNext-ios.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Venera-Next/images/news.png"

[output]
path = "apps.json"
