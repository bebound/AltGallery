# altgen config for the YouMod AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "jaydenjcpy/YouMod"

[source]
name = "YouMod"
subtitle = "YouMod AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for YouMod"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouMod/icon.png"
website = "https://github.com/jaydenjcpy/YouMod"
tint_color = "#FF0000"

[app]
name = "YouMod"
bundle_identifier = "com.google.ios.youtube"
developer_name = "Tonwalter888"
subtitle = "YouTube mod with YTLite-style tweaks"
description = "YouMod is a modded YouTube for iOS that recreates YTLite features without a paywall: ad removal, background playback, downloads up to 1080p60, built-in SponsorBlock, OLED theme and keyboard, and extensive UI customization."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouMod/icon.png"
screenshots = []
tint_color = "#FF0000"
min_os_version = "14.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): match the flagship YouMod_<ytver>_v<tweak>.ipa
# assets across releases (releases that only ship .deb files are skipped).
asset_pattern = "^YouMod_.*\\.ipa$"
# Release tags are youmod-ipaN; the meaningful version lives in the asset
# filename, e.g. YouMod_21.36.6_v2.0.0.ipa -> base YouTube version 21.36.6.
version_source = "filename"
version_pattern = "^YouMod_v?([0-9]+\\.[0-9]+\\.[0-9]+)"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by templates/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/YouMod/images/news.png"

[output]
path = "apps.json"
