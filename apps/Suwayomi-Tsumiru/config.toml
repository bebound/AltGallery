# altgen config for the Tsumiru AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "Suwayomi/Suwayomi-Tsumiru"

[source]
name = "Tsumiru"
subtitle = "Tsumiru AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Tsumiru"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Suwayomi-Tsumiru/icon.png"
website = "https://github.com/Suwayomi/Suwayomi-Tsumiru"
tint_color = "#7c7bff"

[app]
name = "Tsumiru"
bundle_identifier = "com.suwayomi.tachideskSorayomi"
developer_name = "Suwayomi"
subtitle = "Native manga & manhwa reader for Suwayomi-Server"
description = "Tsumiru is a native client for reading manga & manhwa from a Suwayomi-Server instance, built for long webtoon binges. Offline downloads with an on-device catalog, a rebuilt continuous-scroll webtoon reader, incognito mode, and 13 built-in themes."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Suwayomi-Tsumiru/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Suwayomi-Tsumiru/images/list.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Suwayomi-Tsumiru/images/update.jpg",
]
tint_color = "#7c7bff"
min_os_version = "14.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each release has exactly one ipa (iOS build tsumiru-v*.ipa).
# The macOS build is a .zip and won't be matched.
asset_pattern = "-ios\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Suwayomi-Tsumiru/images/news.png"

[output]
path = "apps.json"
