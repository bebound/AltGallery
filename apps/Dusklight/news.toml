# render_news.py config: uv run tools/render_news.py --out apps/Dusklight
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Dusklight"
tagline = "Twilight Princess reimplementation"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#C4901E"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#C4901E"      # bottom-right glow (default: [source] tint_color)
# background = "#F5E9D7"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#FAF3E8"        # gradient mid stop (derived from background)
# bg_dark = "#EEDCBE"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#C4901E" # tagline text (derived from background)
