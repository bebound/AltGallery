# render_news.py config: python3 tools/render_news.py --out apps/DLiPA
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "DLiPA"
tagline = "Download, install and share IPAs"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#27A0F4"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#27A0F4"      # bottom-right glow (default: [source] tint_color)
# background = "#DBEDFC"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#EBF5FE"        # gradient mid stop (derived from background)
# bg_dark = "#C4E1FA"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#2096E8" # tagline text (derived from background)
