# altgen config for the AltStore source.
# Run: uvx altgen -c config.toml
# AltStore: alternative app store for non-jailbroken iOS devices (Classic build)

[github]
repo = "altstoreio/AltStore"

[source]
name = "AltStore"
subtitle = "AltStore AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for AltStore"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/icon.png"
website = "https://github.com/altstoreio/AltStore"
tint_color = "#018084"

[app]
name = "AltStore"
bundle_identifier = "com.rileytestut.AltStore"
developer_name = "Riley & Shane"
subtitle = "Sideload non-notarized apps with AltServer."
description = "AltStore Classic allows you to sideload non-notarized .ipa files with AltServer on a Mac or PC."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/images/myapps.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/images/app-detail.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/images/browse.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/images/sources.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/images/add-source.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/images/settings.png",
]
tint_color = "#018084"
min_os_version = "17.4"

[versions]
strip_v_prefix = true
include_prereleases = false
# Read the version from the ipa's Info.plist: the release tag is v2.3 while the
# ipa inside it reports 2.3.1 (build 63).
version_source = "ipa"
# Each release ships a single ipa: AltStore_Classic_Notarized_<version>.ipa
asset_pattern = "AltStore_Classic_Notarized_.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AltStore/images/news.png"

[output]
path = "apps.json"
