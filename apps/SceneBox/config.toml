# altgen config for the SceneBox AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "donbytyqi/scenebox"

[source]
name = "SceneBox"
subtitle = "SceneBox AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for SceneBox"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SceneBox/icon.png"
website = "https://github.com/donbytyqi/scenebox"
tint_color = "#E0E000"

[app]
name = "SceneBox"
bundle_identifier = "app.scenebox.SceneBox"
developer_name = "donbytyqi"
subtitle = "Torrent streaming client"
description = "Torrent streaming client for iOS, iPadOS, tvOS and Mac (Catalyst), written in SwiftUI. Streams come from Stremio-compatible addons and play through a vendored libtorrent engine feeding VLC."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SceneBox/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SceneBox/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SceneBox/images/search.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SceneBox/images/profile.png",
]
tint_color = "#E0E000"
min_os_version = "18.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob). Matches the iOS ipa (SceneBox-1.0.2.ipa)
# while excluding the tvOS variant (SceneBox-1.0.2-tvOS.ipa) and the Mac DMG.
asset_pattern = "SceneBox-[0-9]+\\.[0-9]+\\.[0-9]+\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SceneBox/images/news.png"

[output]
path = "apps.json"
