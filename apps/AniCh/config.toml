# altgen config for the AniCh AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "Sle2p/AniCh"

[source]
name = "AniCh"
subtitle = "AniCh AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for AniCh"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniCh/icon.webp"
website = "https://github.com/Sle2p/AniCh"
tint_color = "#F0E0D0"

[app]
name = "AniCh"
bundle_identifier = "app.anich"
developer_name = "Sle2p"
subtitle = "支持超分辨率的在线动漫弹幕播放器"
description = "支持超分辨率、多平台、多番剧源与多弹幕的在线动漫播放应用，高清无广告。提供番剧索引与搜索、倍速播放、观看记录、追番管理、弹幕过滤与举报、分集评论和离线缓存。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniCh/icon.webp"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniCh/images/home.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniCh/images/detail.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniCh/images/play.webp",
]
tint_color = "#F0E0D0"
min_os_version = "12.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each release publishes a single ipa, named anich-ios-no_sign-*.ipa
asset_pattern = "anich-ios-no_sign-.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/AniCh/images/news.webp"

[output]
path = "apps.json"
