# render_news.py config: python3 tools/render_news.py --out apps/Stats
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Stats"
tagline = "Your Mac's activity, at a glance"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#2090F0"            # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#2090F0"        # bottom-right glow (default: [source] tint_color)
# background = "#D6E4F2"      # gradient base (derived from the icon's dominant color)
# bg_mid = "#E2ECF7"          # gradient mid stop (derived from background)
# bg_dark = "#C1D6EC"         # gradient end stop (derived from background)
# text_color = "#111111"      # app name (auto white/black)
# tagline_color = "#3A80C0"   # tagline text (derived from background)
