# render_news.py config: uv run tools/render_news.py --out apps/GhostRemote
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Ghost Remote"
tagline = "iGhostVT terminals\non another device"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#009051"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#009051"      # bottom-right glow (default: [source] tint_color)
# background = "#E9E9F6"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#F4F4FA"        # gradient mid stop (derived from background)
# bg_dark = "#DADAF0"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#5F5F8C" # tagline text (derived from background)
