# render_news.py config: .venv/bin/python tools/render_news.py --out apps/PSX3IOS
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "PSX3IOS"
tagline = "A PlayStation 3 emulator for iPhone and iPad, built on RPCS3"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#5080D0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#5080D0"      # bottom-right glow (default: [source] tint_color)
# background = "#..."       # gradient base (derived from the icon's dominant color)
# bg_mid = "#..."           # gradient mid stop (derived from background)
# bg_dark = "#..."          # gradient end stop (derived from background)
# text_color = "#FFFFFF"    # app name (auto white/black)
# tagline_color = "#..."    # tagline text (derived from background)
