# altgen config for the PSX3IOS AltStore source.
# Run: uvx altgen -c config.toml
# Fields derived from the xmiguel911x/PSX3IOS repo README and the beta IPA
# (no AltStore source in the repo). Bundle id / min OS read from the IPA's
# Info.plist.

[github]
repo = "xmiguel911x/PSX3IOS"

[source]
name = "PSX3IOS"
subtitle = "PSX3IOS AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for PSX3IOS"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/PSX3IOS/icon.png"
website = "https://github.com/xmiguel911x/PSX3IOS"
tint_color = "#5080D0"

[app]
name = "PSX3IOS"
bundle_identifier = "com.miguel.psx3ios"
developer_name = "xmiguel911x"
subtitle = "PlayStation 3 emulator for iPhone and iPad"
description = "A PlayStation 3 emulator for iPhone and iPad, built on RPCS3. Real games boot and play — the whole emulator core is exposed, with community game patches, trophies, play time, save data and 14 languages. Works with or without JIT."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/PSX3IOS/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/PSX3IOS/images/home.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/PSX3IOS/images/install.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/PSX3IOS/images/settings.jpg",
]
tint_color = "#5080D0"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
# All PSX3IOS releases are alpha/beta-tagged, so prereleases must be kept.
include_prereleases = true
# asset_pattern is a regex (not glob): .*\.ipa$ matches all ipa assets.
# Only some releases ship an ipa (PSX3IOS-beta.<n>-unsigned.ipa); releases
# without an ipa are skipped.
asset_pattern = ".*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/PSX3IOS/images/news.png"

[output]
path = "apps.json"
