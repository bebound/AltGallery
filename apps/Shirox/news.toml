# render_news.py config: uv run tools/render_news.py --out apps/Shirox
# Colors are pinned explicitly: Shirox's icon is a white mark on black, so the
# auto-derived palette had no brand color to recover. A neutral grey scale
# matches the monochrome mark instead.

name = "Shirox"
tagline = "Anime and manga\nlibrary manager"

# Color notes — each key below controls one element of the image.
[colors]
tint = "#1C1C1E"          # NEW UPDATE badge + top-left glow
tint_alt = "#1C1C1E"      # bottom-right glow
background = "#EDEDED"    # gradient base
bg_mid = "#F7F7F7"        # gradient mid stop
bg_dark = "#DCDCDC"       # gradient end stop
text_color = "#111111"    # app name
tagline_color = "#6E6E73" # tagline text
