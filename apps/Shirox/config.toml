# altgen config for the Shirox AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "xibrox/Shirox"

[source]
name = "Shirox"
subtitle = "Shirox AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Shirox"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Shirox/icon.webp"
website = "https://github.com/xibrox/Shirox"
tint_color = "#1C1C1E"

[app]
name = "Shirox"
bundle_identifier = "com.shirox.app"
developer_name = "xibrox"
subtitle = "Personal anime and manga library manager for iOS"
description = "A free, source-available library manager for iPhone, iPad and Mac. Track what you watch and read, keep it in sync with AniList and MyAnimeList, and play it from the sources you connect."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Shirox/icon.webp"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Shirox/images/detail.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Shirox/images/home.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Shirox/images/library.webp",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Shirox/images/player.webp",
]
tint_color = "#1C1C1E"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Read the version from the ipa's Info.plist: the release tag is "latest"
# while the ipa inside it reports 1.0.6 (build 126).
version_source = "ipa"
# Each release ships a single ipa: Shirox.ipa
asset_pattern = "Shirox\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Shirox/images/news.webp"

[output]
path = "apps.json"
