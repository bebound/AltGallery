# altgen config for the WQToolkit AltStore source.
# Run: uvx altgen -c config.toml
# WQToolkit: file browser and maintenance panel for your own app containers

[github]
repo = "MchinaMd57764/WQToolkit"

[source]
name = "WQToolkit"
subtitle = "WQToolkit AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for WQToolkit"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/WQToolkit/icon.png"
website = "https://github.com/MchinaMd57764/WQToolkit"
tint_color = "#6090D0"

[app]
name = "WQToolkit"
bundle_identifier = "com.zhangfuhao.wqtoolkit"
developer_name = "MchinaMd57764"
subtitle = "File browser and maintenance panel for your own app containers"
description = "An iOS toolkit built on an App Group container-query primitive: browse, clean and inspect your own app data containers without a jailbreak. Includes a file browser, cache scan, device info, a MobileGestalt cache panel and data lenses, with a bilingual UI and iPhone/iPad layouts."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/WQToolkit/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/WQToolkit/images/files.jpeg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/WQToolkit/images/settings.jpeg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/WQToolkit/images/tweaks.jpeg",
]
tint_color = "#6090D0"
min_os_version = "27.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each release ships one ipa,
# WQToolkit-unsigned.ipa (unsigned, re-sign with your own identity).
asset_pattern = "WQToolkit-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/WQToolkit/images/news.png"

[output]
path = "apps.json"
