# render_news.py config: python3 tools/render_news.py --out apps/WQToolkit
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "WQToolkit"
tagline = "Browse and clean your app containers"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#6090D0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#6090D0"      # bottom-right glow (default: [source] tint_color)
# background = "#D6DFEB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E7ECF3"        # gradient mid stop (derived from background)
# bg_dark = "#BBCADE"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#5180BD" # tagline text (derived from background)
