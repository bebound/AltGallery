# altgen config for the Husk AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "Leviidev/Husk"

[source]
name = "Husk"
subtitle = "Husk AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Husk"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Husk/icon.png"
website = "https://github.com/Leviidev/Husk"
tint_color = "#5949E5"

[app]
name = "Husk"
bundle_identifier = "com.husk.app"
developer_name = "Leviidev"
subtitle = "Android app launcher for iOS"
description = "Run Android apps on iOS: drop in an APK, tap it, and the Android app opens full-screen on a QEMU guest with hardware-accelerated display and audio. Needs JIT plus a debugger attached at runtime, so it requires a sideloading setup that can provide get-task-allow rather than a plain re-sign."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Husk/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Husk/images/main.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Husk/images/settings.png",
]
tint_color = "#5949E5"
min_os_version = "16.4"

[versions]
# Tags are plain semver (0.2.0 … 0.4.1) — no v prefix to strip.
strip_v_prefix = false
include_prereleases = false
# The repo also carries a lineage-v2 tag for VM disk images (no ipa); anchoring
# on strict semver keeps it out of the app's version list.
version_pattern = "^(\\d+\\.\\d+\\.\\d+)$"
# asset_pattern is a regex (not glob): every app release ships exactly one
# unsigned ipa named Husk.ipa.
asset_pattern = "^Husk\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Husk/images/news.png"

[output]
path = "apps.json"
