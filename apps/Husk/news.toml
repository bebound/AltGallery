# render_news.py config: python3 tools/render_news.py --out apps/Husk
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Husk"
tagline = "Android apps on iOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#5949E5"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#5949E5"      # bottom-right glow (default: [source] tint_color)
# background = "#E2DEF8"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#EFEDFB"        # gradient mid stop (derived from background)
# bg_dark = "#CFC8F2"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#6E5FE8" # tagline text (derived from background)
