# render_news.py config: python3 tools/render_news.py --out apps/GestaltX
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "GestaltX"
tagline = "MobileGestalt editor for iOS 27"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#007AFF"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#007AFF"      # bottom-right glow (default: [source] tint_color)
background = "#EFE7D6"      # gradient base — the icon's own warm cream
# bg_mid = "#F6F2E8"        # gradient mid stop (derived from background)
# bg_dark = "#E4D6B9"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
tagline_color = "#6E7B8C"   # tagline text — cool grey-blue, matching the tint
