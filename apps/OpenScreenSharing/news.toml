# render_news.py config: uv run tools/render_news.py --out apps/OpenScreenSharing
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Open Screen Sharing"
tagline = "Remote desktop client\nfor Mac, VNC & RDP"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#1060F0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#1060F0"      # bottom-right glow (default: [source] tint_color)
# background = "#D8E4FB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E8EEFD"        # gradient mid stop (derived from background)
# bg_dark = "#BED2F6"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#4682F2" # tagline text (derived from background)
