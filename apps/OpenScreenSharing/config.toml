# altgen config for the Open Screen Sharing AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "nekohasekai/open-screen-sharing"

[source]
name = "Open Screen Sharing"
subtitle = "Open Screen Sharing AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Open Screen Sharing"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/OpenScreenSharing/icon.webp"
website = "https://github.com/nekohasekai/open-screen-sharing"
tint_color = "#1060F0"

[app]
name = "Open Screen Sharing"
bundle_identifier = "io.nekohasekai.screensharing"
developer_name = "nekohasekai"
subtitle = "Remote desktop client optimized for Mac screen sharing"
description = "Open Screen Sharing is a free and open-source remote desktop client optimized for Mac screen sharing and public networks, while also offering first-class support for standard VNC and RDP."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/OpenScreenSharing/icon.webp"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/OpenScreenSharing/images/session.webp",
]
tint_color = "#1060F0"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): stay off the .pkg and dSYM assets.
# Every release ships the iOS build as OpenScreenSharing.ipa.
asset_pattern = "OpenScreenSharing\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/OpenScreenSharing/images/news.webp"

[output]
path = "apps.json"
