# altgen config for the EhPanda AltStore source.
# Run: uvx altgen -c config.toml
# EhPanda: 使用 SwiftUI 与 TCA 构建的非官方 E-Hentai iOS 客户端

[github]
repo = "EhPanda-Team/EhPanda"

[source]
name = "EhPanda"
subtitle = "EhPanda AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for EhPanda"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/EhPanda/icon.png"
website = "https://github.com/EhPanda-Team/EhPanda"
tint_color = "#0f766e"

[app]
name = "EhPanda"
bundle_identifier = "app.ehpanda"
developer_name = "EhPanda-Team"
subtitle = "An unofficial E-Hentai App for iOS built with SwiftUI & TCA"
description = "EhPanda is an unofficial E-Hentai app for iOS & iPadOS built with SwiftUI & TCA. It supports almost all E-Hentai gallery categories, gallery browsing with filters, gallery details with tags & related galleries, posting / editing / replying to comments, H@H archiving, torrent listing, E-Hentai settings, and SNI-bypass (domain fronting) for restricted networks. Localization is built in and the app icon and accent color are customizable."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/EhPanda/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/EhPanda/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/EhPanda/images/detail.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/EhPanda/images/comment.png",
]
tint_color = "#0f766e"
min_os_version = "26.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Each release contains a single ipa: EhPanda.ipa
asset_pattern = "EhPanda\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/EhPanda/images/news.png"

[output]
path = "apps.json"
