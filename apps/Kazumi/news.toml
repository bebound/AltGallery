name = "Kazumi"
tagline = "基于自定义规则的番剧采集与在线观看"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#4CAF50"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#4CAF50"      # bottom-right glow (default: [source] tint_color)
