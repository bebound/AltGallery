# render_news.py config: python3 tools/render_news.py --out apps/Swipt
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Swipt"
tagline = "iOS automation platform"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#455A64"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#78909C"      # bottom-right glow (default: [source] tint_color)
# background = "#DAE7E7"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E9F1F1"        # gradient mid stop (derived from background)
# bg_dark = "#C1D7D7"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#5CB3B3" # tagline text (derived from background)
