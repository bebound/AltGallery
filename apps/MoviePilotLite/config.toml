# altgen config for the MoviePilotLite AltStore source.
# Run: uvx altgen -c config.toml
# Fields derived from the singleton-altman/MoviePilotLite README (no AltStore source in the repo).

[github]
repo = "singleton-altman/MoviePilotLite"

[source]
name = "MoviePilotLite"
subtitle = "MoviePilotLite AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for MoviePilotLite"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilotLite/icon.png"
website = "https://github.com/singleton-altman/MoviePilotLite"
tint_color = "#8050F0"

[app]
name = "MoviePilotLite"
bundle_identifier = "com.altman.moviepilot"
developer_name = "singleton-altman"
subtitle = "MoviePilot 移动端，基于 Flutter 实现"
description = "基于 MoviePilot 的 Flutter 跨端客户端，对接 MoviePilot v2 API，在手机上完成订阅、搜索、下载、整理与系统运维等常用操作。"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilotLite/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilotLite/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilotLite/images/recommend.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilotLite/images/explorer.png",
]
tint_color = "#8050F0"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Three historical ipa naming schemes: ios-v<version>-<date>.ipa (recent),
# app-unsigned.ipa (older v<version>-ios-<date> tags). The transitional
# release-v1.0.8 also ships a bare v1.0.8-<date>.ipa which we exclude.
asset_pattern = "(ios-.*|app-unsigned)\\.ipa$"
# Tags are like release-v1.2.3-2026-08-21; extract the clean semver (1.2.3)
# from the release name (v1.2.3-2026-08-21).
version_source = "release"
version_pattern = "v?(\\d+\\.\\d+\\.\\d+)"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/MoviePilotLite/images/news.png"

[output]
path = "apps.json"
