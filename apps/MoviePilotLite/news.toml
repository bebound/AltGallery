# render_news.py config: .venv/bin/python tools/render_news.py --out apps/MoviePilotLite
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "MoviePilotLite"
tagline = "MoviePilot 移动端客户端"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#8050F0"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#8050F0"      # bottom-right glow (default: [source] tint_color)
# background = "#DCD6EB"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#EBE7F3"        # gradient mid stop (derived from background)
# bg_dark = "#C5BBDE"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#7051BD" # tagline text (derived from background)
