# render_news.py config: python3 tools/render_news.py --out apps/Feather
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Feather"
tagline = "On-device signing & installer"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#848EF9"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#848EF9"      # bottom-right glow (default: [source] tint_color)
# background = "#E4E6FA"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#F0F1FC"        # gradient mid stop (derived from background)
# bg_dark = "#D3D7F6"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#666FDB" # tagline text (derived from background)
