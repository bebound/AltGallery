# altgen config for the SpotiFLAC AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "spotiflacapp/SpotiFLAC-Mobile"

[source]
name = "SpotiFLAC"
subtitle = "SpotiFLAC AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for SpotiFLAC"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SpotiFLAC/icon.png"
website = "https://github.com/spotiflacapp/SpotiFLAC-Mobile"
tint_color = "#1DB954"

[app]
name = "SpotiFLAC"
bundle_identifier = "com.zarz.spotiflac"
developer_name = "zarzet"
subtitle = "FLAC Downloader for iOS"
description = "SpotiFLAC is a Flutter music app built around installable extensions: an extension supplies the metadata and the audio downloads for one provider, so sources can be added or repaired without an app update. Downloads land in a local library with lyrics, cover art, quality badges and duplicate detection."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SpotiFLAC/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SpotiFLAC/images/home.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SpotiFLAC/images/library.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SpotiFLAC/images/store.jpg",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SpotiFLAC/images/settings.jpg",
]
tint_color = "#1DB954"
min_os_version = "16.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each release also ships arm32/arm64
# Android apks, so pin the ipa explicitly.
asset_pattern = "-ios-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/SpotiFLAC/images/news.png"

[output]
path = "apps.json"
