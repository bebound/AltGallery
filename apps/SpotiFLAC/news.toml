# render_news.py config: ./.venv/bin/python tools/render_news.py --out apps/SpotiFLAC
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "SpotiFLAC"
tagline = "Lossless audio from installable sources"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
tint = "#1DB954"            # NEW UPDATE badge + top-left glow (icon's green; the icon is 92% black, so the sampler returns #001000 — pinned by hand)
# background = "#D9EFE0"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#E9F6ED"        # gradient mid stop (derived from background)
# bg_dark = "#C2E4CD"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
tagline_color = "#1DB954"   # tagline text (pinned to the tint; the derived value read too pale on the green gradient)
