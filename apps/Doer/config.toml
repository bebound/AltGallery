# altgen config for the Doer AltStore source.
# Run: uvx altgen -c config.toml
# Fields derived from the moliango/doer README (no AltStore source in the repo).

[github]
repo = "moliango/doer"

[source]
name = "Doer"
subtitle = "Doer AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Doer"
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Doer/icon.png"
website = "https://github.com/moliango/doer"
tint_color = "#4080E0"

[app]
name = "Doer"
bundle_identifier = "com.naine.doer"
developer_name = "moliango"
subtitle = "A native iOS client for Linux.do"
description = "A native iOS client for Linux.do — UIKit + Swift, no SwiftUI in the main app."
icon_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Doer/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Doer/images/home.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Doer/images/detail.png",
  "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Doer/images/me.png",
]
tint_color = "#4080E0"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): .*\.ipa$ matches all ipa assets
# Compatible with both naming schemes: doer-unsigned.ipa and dexoflux-unsigned.ipa
asset_pattern = ".*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Doer/images/news.png"

[output]
path = "apps.json"
