# render_news.py config: uv run tools/render_news.py --out apps/Fladder
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Fladder"
tagline = "Jellyfin client\nfor iOS"

# Color notes — each key below controls one element of the image. All are
# optional: unset keys are auto-derived. Shown values are the current result.
[colors]
# tint = "#F04040"          # NEW UPDATE badge + top-left glow (default: [app] tint_color)
# tint_alt = "#F04040"      # bottom-right glow (default: [source] tint_color)
# background = "#FBDCDC"    # gradient base (derived from the icon's dominant color)
# bg_mid = "#FDEBEB"        # gradient mid stop (derived from background)
# bg_dark = "#F5C3C3"       # gradient end stop (derived from background)
# text_color = "#111111"    # app name (auto white/black)
# tagline_color = "#F04040" # tagline text (derived from background)
